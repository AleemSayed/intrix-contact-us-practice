
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us | Intrix Solutions</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="contact-container">

        <section class="contact-info">

            <p class="tagline">INTRIX SOLUTIONS</p>

            <h1>Let's start a conversation.</h1>

            <p>
                Have a question or a project in mind?
                Fill out the form and our team will get back to you.
            </p>

        </section>

        <section class="form-section">

            <h2>Contact Us</h2>

            <form id="contactForm">

                <!-- Full Name -->
                <div class="form-group">

                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                        minlength="2"
                        maxlength="100"
                    >

                </div>


                <!-- Phone Number -->
                <div class="form-group">

                    <label for="phone">Phone Number</label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        required
                        minlength="10"
                        maxlength="16"
                        pattern="\+?[0-9]{10,15}"
                        title="Enter 10-15 digits, optionally starting with +"
                        inputmode="tel"
                    >

                </div>


                <!-- Email Address -->
                <div class="form-group">

                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        required
                        maxlength="255"
                    >

                </div>


                <!-- Subject -->
                <div class="form-group">

                    <label for="subject">Subject</label>

                    <select
                        id="subject"
                        name="subject"
                        required
                    >
                        <option value="General Enquiry">
                            General Enquiry
                        </option>

                        <option value="Sales">
                            Sales
                        </option>

                        <option value="Technical Support">
                            Technical Support
                        </option>

                        <option value="Partnership">
                            Partnership
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- Message -->
                <div class="form-group">

                    <label for="message">Message</label>

                    <textarea
                        id="message"
                        name="message"
                        placeholder="Tell us how we can help..."
                        rows="5"
                        required
                        minlength="5"
                        maxlength="2000"
                    ></textarea>

                </div>


                <!-- Attachments -->
                <div class="form-group">

                    <label for="attachments">Attachments</label>

                    <input
                        type="file"
                        id="attachments"
                        name="files"
                        multiple
                        accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png,.txt,.csv"
                    >

                    <small>
                        Supported formats: PDF, DOC, DOCX, XLS,
                        XLSX, JPG, JPEG and PNG.
                        Maximum 10 files, 10 MB each.
                        Maximum combined size: 100 MB.
                    </small>

                    <ul id="fileList"></ul>

                </div>


                <!-- Submit -->
                <button type="submit" id="submitBtn">
                    Submit
                </button>

                <!-- Submission Status -->
                <p id="formStatus" role="status"></p>

            </form>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
